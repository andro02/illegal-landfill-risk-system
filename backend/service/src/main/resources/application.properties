spring.application.name=service

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# how often the simulator reports a newly detected landfill (ISO-8601 duration,
# e.g. PT24H, PT48H, or PT30S for testing) and when the first one comes
simulator.detection-interval=PT24H
simulator.initial-delay=PT2M
